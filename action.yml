name: 'puLL-Merge'
description: 'puLL-Merge is a github-action to add LLM capabilities to pull-requests in github automatically'
inputs:
  github_token:
    description: |
      Secret token to push review comments, and
      interact with the repository systematically
    required: true
  openai_api_key:
    description: |
      API key to interact with the OpenAI endpoint
  anthropic_api_key:
    description: |
      API key to interact with the Anthropic endpoint
  debounce_time:
    description: |
      Debounce Time in hours
  bounce_label:
    description: |
      PR label that disables the debounce window, forcing the review to
      regenerate on every run. Defaults to "bounce"
    required: false
  amplification:
    description: |
      Amplification factor for the generated text
  filterdiff_args:
    description: |
      Arguments to pass to filterdiff
  openai_models:
    description: |
      selection of models to use for the openai endpoint
  anthropic_models:
    description: |
      selection of models to use for the anthropic endpoint
  bedrock_models:
    description: |
      selection of models to use for the bedrock endpoint
  run_if_private:
    description: |
      run the action even if the repository is private
  debug:
    description: enables debug output for this action
    required: false
  repo:
    description: |
      force the repository to run the action on
    required: false
  owner:
    description: |
      force the owner to run the action on
    required: false
  prnum:
    description: |
      force the pull request number to run the action on
    required: false
  max_tokens:
    description: |
      maximum number of tokens to generate
    required: false
  bedrock_aws_iam_role_arn:
    description: |
      AWS IAM Role ARN to interact with the Bedrock endpoint
    default: ""
  region:
    description: |
      AWS region to interact with the Bedrock endpoint
    default: ""
  include_diff:
    description: |
      Include the diff in the generated text
    required: false
  system_prompt:
    description: |
      Custom system prompt for the LLM. If not provided, uses the default from utils.js
    required: false
# outputs:
runs:
  using: 'composite'
  steps:
    - if: ${{ inputs.bedrock_aws_iam_role_arn != '' && inputs.region != ''}}
      name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
      with:
        role-to-assume: ${{ inputs.bedrock_aws_iam_role_arn }}
        aws-region: ${{ inputs.region }}
    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version: '24.x'
    - name: Install patchutils
      # Acquire::Retries + network timeouts retry transient fetch failures
      # from the apt mirrors instead of failing the whole run on one 5xx/403.
      run: sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 patchutils
      shell: bash
    - id: install-deps
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # Retry loop: corepack's pnpm version lookup is a single unretried
      # registry.npmjs.org request that hard-failed jobs during the Oct 22
      # npmjs outage (brave/security-action#1045). The exit code is captured
      # directly from the command: an `if cmd; then break; fi` wrapper would
      # make `$?` report the if-statement's status (0) instead of the
      # failure, and a fully failed install would pass the job silently.
      run: |-
        cd ${{ github.action_path }} || exit $?
        attempt=1
        pnpm_rc=0
        while :; do
          corepack pnpm install --frozen-lockfile
          pnpm_rc=$?
          if [ "$pnpm_rc" -eq 0 ]; then
            break
          fi
          if [ "$attempt" -ge 3 ]; then
            echo "pnpm install failed after $attempt attempts (last exit $pnpm_rc)" >&2
            break
          fi
          sleep $((15 * 2 ** (attempt - 1))) # 15s, 30s
          attempt=$((attempt + 1))
        done
        exit $pnpm_rc
      shell: bash
    - id: llm-and-post-message
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      if: ${{ !contains(github.event.pull_request.labels.*.name, 'CI/skip-llm') && !contains(github.event.pull_request.labels.*.name, 'CI/skip') && github.event.pull_request.draft == false }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DEBUG: ${{ (inputs.debug == 'true' || runner.debug) && 'true' || 'false'}}
      with:
          # retries: exponential backoff via @octokit/plugin-retry for transient
          # 5xx/timeouts. Default retry-exempt-status-codes (400/401/403/404/422)
          # keeps permission/validation errors fail-fast.
          retries: 3
          script: |
            const actionPath = '${{ github.action_path }}'
            const script = require(`${actionPath}/action.cjs`)
            const inputs = ${{ toJson(inputs) }}
            await script({github, context, inputs, actionPath})
