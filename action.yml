name: 'puLL-Merge'
description: 'puLL-Merge is a github-action to add LLM capabilities to pull-requests in github automatically'
inputs:
  github_token:
    description: |
      Secret token to push review comments, and
      interact with the repository systematically
    required: true
  openai_api_key:
    description: |
      API key to interact with the OpenAI endpoint
  anthropic_api_key:
    description: |
      API key to interact with the Anthropic endpoint
  debounce_time:
    description: |
      Debounce Time in hours
  bounce_label:
    description: |
      PR label that disables the debounce window, forcing the review to
      regenerate on every run. Defaults to "bounce"
    required: false
  amplification:
    description: |
      Amplification factor for the generated text
  filterdiff_args:
    description: |
      Arguments to pass to filterdiff
  openai_models:
    description: |
      selection of models to use for the openai endpoint
  anthropic_models:
    description: |
      selection of models to use for the anthropic endpoint
  bedrock_models:
    description: |
      selection of models to use for the bedrock endpoint
  run_if_private:
    description: |
      run the action even if the repository is private
  debug:
    description: enables debug output for this action
    required: false
  repo:
    description: |
      force the repository to run the action on
    required: false
  owner:
    description: |
      force the owner to run the action on
    required: false
  prnum:
    description: |
      force the pull request number to run the action on
    required: false
  max_tokens:
    description: |
      maximum number of tokens to generate
    required: false
  bedrock_aws_iam_role_arn:
    description: |
      AWS IAM Role ARN to interact with the Bedrock endpoint
    default: ""
  region:
    description: |
      AWS region to interact with the Bedrock endpoint
    default: ""
  include_diff:
    description: |
      Include the diff in the generated text
    required: false
  system_prompt:
    description: |
      Custom system prompt for the LLM. If not provided, uses the default from utils.js
    required: false
# outputs:
runs:
  using: 'composite'
  steps:
    - id: runtime
      name: Detect prebuilt image runtime
      # Inside the OCI image (ghcr.io/brave/pull-merge) node, pnpm,
      # filterdiff (patchutils) and the baked node_modules are already
      # present; the host-only setup steps below are skipped then.
      run: |-
        if [ -f /opt/brave-pull-merge/manifest.json ]; then
          echo "image=true" >> "$GITHUB_OUTPUT"
        else
          echo "image=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - if: ${{ inputs.bedrock_aws_iam_role_arn != '' && inputs.region != ''}}
      name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
      with:
        role-to-assume: ${{ inputs.bedrock_aws_iam_role_arn }}
        aws-region: ${{ inputs.region }}
    - if: ${{ steps.runtime.outputs.image != 'true' }}
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version: '24.x'
    - if: ${{ steps.runtime.outputs.image != 'true' }}
      name: Install patchutils
      # Baked into the prebuilt image at /usr/bin/filterdiff.
      run: sudo apt-get install -y patchutils
      shell: bash
    - id: install-deps
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |-
        cd ${{ github.action_path }}
        if [ -f /opt/brave-pull-merge/manifest.json ]; then
          # Image mode: the baked node_modules tree mirrors the lockfile
          # recorded at image build time. When the checked-out lockfile
          # still hashes to it, reuse the tree verbatim (zero network,
          # zero install). A PR that changed the lockfile falls back to
          # the online install with the baked pnpm (no corepack registry
          # hop).
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          BAKED_SHA="$(sed -n 's/.*"pnpm_lock_sha256": *"\([0-9a-f]*\)".*/\1/p' /opt/brave-pull-merge/manifest.json)"
          if [ -n "$BAKED_SHA" ] && [ "$LOCK_SHA" = "$BAKED_SHA" ]; then
            echo "Prebuilt image: lockfile matches the manifest; reusing baked node_modules"
            rm -rf node_modules
            cp -a /opt/pull-merge/node_modules ./node_modules
            exit 0
          fi
          echo "Lockfile differs from the baked image; installing online with the baked pnpm"
          pnpm install --frozen-lockfile
          exit 0
        fi
        corepack pnpm install --frozen-lockfile
      shell: bash
    - id: llm-and-post-message
      # action.cjs used to run through actions/github-script, which only
      # executes on the host — the job container never saw the review
      # pipeline. run.cjs is a run: step: it executes inside the container
      # and rebuilds the github-script surface (github/context) from the
      # standard runner environment. Inputs arrive on stdin as JSON via a
      # quoted heredoc, so no YAML quoting pitfalls.
      run: |-
        node "${{ github.action_path }}/run.cjs" <<'PULL_MERGE_INPUTS_EOF'
        ${{ toJson(inputs) }}
        PULL_MERGE_INPUTS_EOF
      shell: bash
      if: ${{ !contains(github.event.pull_request.labels.*.name, 'CI/skip-llm') && !contains(github.event.pull_request.labels.*.name, 'CI/skip') && github.event.pull_request.draft == false }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DEBUG: ${{ (inputs.debug == 'true' || runner.debug) && 'true' || 'false'}}
