name: loop openai
# Disabled: OpenAI org has no credits (insufficient_quota) — every run fails
# regardless of code. Re-enable once billing is restored.
on:
  pull_request:
    branches-ignore:
      - '**'
permissions:
  contents: read
  id-token: write
  pull-requests: write    
jobs:
  loop:
    name: loop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: |
          pwd
          tree -a
        shell: bash
      - uses: ./
        with:
          debug: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          region: us-west-2
          amplification: 0 # always trigger the action
