name: image

# Builds and pushes the prebuilt runtime image consumed by
# brave/workflows (.github/workflows/pull-merge.yml container:):
#
#   push to main      → ghcr.io/brave/pull-merge:{latest,v1,sha-<sha>}
#   pull_request      → ghcr.io/brave/pull-merge:pr-<number> (validation tag)
#   workflow_dispatch → ghcr.io/brave/pull-merge:branch-<ref-name>
#
# The pnpm pin is computed from package.json — the Dockerfile receives
# it as a build arg and contains no duplicated pin. Rebuilds are
# triggered by anything that changes the baked toolchain or its lockfile.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compute tool pins from source
        id: pins
        run: |
          set -euo pipefail
          PNPM_VERSION="$(node -e "console.log(require('./package.json').packageManager.split('@')[1])")"
          [ -n "$PNPM_VERSION" ] || { echo "pnpm pin not found in package.json" >&2; exit 1; }
          echo "pnpm_version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"

      # PR runs publish a throwaway pr-<number> tag so the image can be
      # tested end to end without touching latest/v1; forks build only —
      # their GITHUB_TOKEN cannot write packages.
      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Docker tags cannot contain '/' — dispatch-triggered branch
          # names like "feat/prebuilt-image" must be flattened.
          SAFE_REF="${REF_NAME//\//-}"
          case "$EVENT_NAME" in
            pull_request) TAG="ghcr.io/brave/pull-merge:pr-${PR_NUMBER}" ;;
            push)         TAG="$(printf 'ghcr.io/brave/pull-merge:latest\nghcr.io/brave/pull-merge:v1\nghcr.io/brave/pull-merge:sha-%s' "$SHA")" ;;
            *)            TAG="ghcr.io/brave/pull-merge:branch-${SAFE_REF}" ;;
          esac
          {
            echo "tags<<IMAGE_TAGS_EOF"
            echo "$TAG"
            echo "IMAGE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PNPM_VERSION=${{ steps.pins.outputs.pnpm_version }}

      # Private org repos can only pull the package anonymously when it is
      # public. GITHUB_TOKEN often lacks admin:packages — best effort; if
      # this 403s, flip visibility once manually (PR body documents this).
      - name: Make package public (best effort)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /orgs/brave/packages/container/pull-merge \
            -f visibility=public || \
            echo "::warning::Could not set package visibility — set ghcr.io/brave/pull-merge to public manually once"
